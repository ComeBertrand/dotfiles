[user]
    name = Come Bertrand
    email = come.bertrand@protonmail.com
[color]
    ui = auto
[alias]
    tree = log --pretty='%Cgreen%h%Creset [%ai] %s %Cred<%Creset%an%Cred>' --decorate --graph

# Work identity: any repo with a gitlab.wiremind.io remote commits as cbertrand@wiremind.io,
# so it follows the clone instead of depending on where it sits on disk. Repos on github stay
# on the personal email above, wiremind's github org included.
#
# One line per URL form — no single pattern covers both. The glob is path-aware like
# gitignore: `*` never crosses a `/`, and `**` is only multi-component right after a `/`,
# so the obvious `git@gitlab.wiremind.io:**` silently matches nothing. Matches on *any*
# remote of the repo, not just origin. Needs git >= 2.36.
[includeIf "hasconfig:remote.*.url:git@gitlab.wiremind.io:*/**"]
    path = ~/.config/git/config-wiremind
[includeIf "hasconfig:remote.*.url:https://gitlab.wiremind.io/**"]
    path = ~/.config/git/config-wiremind
