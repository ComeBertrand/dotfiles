# i3status configuration file.
# see "man i3status" for documentation.
#
# Diverges from the upstream default i3status ships in these ways:
#   - `load` replaced by `cpu_usage`: a percentage of all 16 cores instead of a
#     raw run-queue average. The default `load` module reddens above
#     max_threshold = 5, which on a 16-core box is only ~31% subscribed -- a
#     permanent false alarm.
#   - `memory` shows consumed + percentage rather than two absolute sizes.
#   - `ipv6` dropped: 39 characters of bar for almost no information.
#   - kube context, telepresence, volume and CPU temperature added.
#
# Tradeoff worth remembering: cpu_usage is "% busy over the last interval",
# whereas load average also counts processes blocked in uninterruptible I/O.
# I/O-wait spikes that used to push load past 5 are invisible here by design.
#
# i3status has no exec/script module, so anything needing a command has to
# arrive via a file. The `kube-context` systemd user service writes the file the
# K8S block below reads.

general {
        colors = true
        interval = 5
        # The bar has no `colors` block in i3config.conf, so it uses i3's default
        # BLACK background, and the font is only 8pt -- thin strokes at that size
        # need saturated, bright colours. Contrast ratios against #000000:
        #   good 15.3:1, degraded 15.1:1, bad 7.6:1
        # Red is intrinsically the dimmest of the three: luminance weights the red
        # channel at 0.2126 against green's 0.7152, so a saturated red simply
        # cannot reach green's brightness without turning pink.
        color_good = "#50fa7b"
        color_degraded = "#ffd75f"
        color_bad = "#ff6b6b"
}

order += "read_file KUBE"
order += "path_exists TP"
order += "wireless _first_"
order += "ethernet _first_"
order += "volume master"
order += "battery all"
order += "disk /"
order += "cpu_temperature 0"
order += "cpu_usage"
order += "memory"
order += "tztime local"

# Current kubectl context, published by the kube-context service. Shows a red
# "K8S -" if that file is missing, which is also what you see for the first few
# seconds after login before the service has written it once.
#
# This is the cluster/context only. Staging and prod share a cluster here, so the
# context name does NOT tell you which environment you are pointed at -- the
# namespace does. Adding it would mean extending the service to also publish
# `kubectl config view --minify` output.
read_file KUBE {
        path = "/home/cbertrand/.cache/i3status/kube-context"
        format = "K8S %content"
        format_bad = "K8S -"
}

# Telepresence creates the tel0 TUN device while connected to a cluster, so this
# costs one stat() rather than a `telepresence status` call. It tracks the
# interface, which is a proxy for "connected" -- not which cluster, namespace, or
# intercepts are live. Those would need a status_command wrapper.
path_exists TP {
        path = "/proc/sys/net/ipv4/conf/tel0"
        format = "%title up"
        format_down = "%title down"
}

# %quality IS the signal strength, as a percentage. format_quality strips the
# leading-zero padding i3status applies by default. %signal (the same reading in
# dBm), %bitrate and %frequency are also available; %noise reports "?" on this
# mt7925 card.
wireless _first_ {
        format_up = "W %quality (%essid)"
        format_down = "W down"
        format_quality = "%d%s"
}

# Hidden entirely while unplugged. separator = false is what keeps the empty
# block from leaving a stray separator line in the bar; the cost is no trailing
# separator on the rare occasions the cable IS in.
ethernet _first_ {
        format_up = "E %speed"
        format_down = ""
        separator = false
}

volume master {
        format = "VOL %volume"
        format_muted = "VOL mute"
        device = "pulse"
}

battery all {
        format = "%status %percentage %remaining"
        status_chr = "CHR"
        status_bat = "BAT"
        status_full = "FULL"
        low_threshold = 20
        threshold_type = percentage
        integer_battery_capacity = true
        last_full_capacity = true
}

disk "/" {
        format = "/ %avail"
}

# i3status reads /sys/class/thermal/thermal_zone%d/temp by default, NOT the Intel
# coretemp path -- so zone 0 (acpitz) works on this AMD box. It agrees with
# k10temp Tctl and the thinkpad sensor to the degree.
#
# What the numbers mean on a Ryzen AI 7 PRO 450:
#   60-70 C   idle, normal
#   80-95 C   sustained load. NORMAL -- AMD mobile parts deliberately boost until
#             they hit the thermal ceiling, so a long nix build belongs here.
#   95 C      the threshold below. Not damage, just "cooling is at its limit".
#   ~100 C    Tjmax; the chip throttles itself to stay under it.
#   113 C     ACPI critical trip -> hard shutdown (thermal_zone0 trip_point_0).
#
# So temperature alone rarely justifies worry on this chip. The genuinely bad
# sign is being hot while IDLE (dust, dead fan) -- which needs temp correlated
# against cpu_usage, and that is beyond what i3status can express. Only one
# threshold exists here (there is no degraded tier for cpu_temperature), so it is
# set where it means something rather than where it fires during every build.
cpu_temperature 0 {
        format = "TEMP %degrees°C"
        format_above_threshold = "TEMP %degrees°C HOT"
        max_threshold = 95
        # Sized for the normal format only. min_width is a floor, not a cap, so
        # the block just grows when the " HOT" suffix appears -- reserving room
        # for it here would leave that space dead at every normal temperature.
        min_width = "TEMP 100°C"
        align = "left"
}

cpu_usage {
        format = "CPU %usage"
        degraded_threshold = 60
        max_threshold = 80
        min_width = "CPU 100%"
        align = "left"
}

# Both thresholds are evaluated against *available* memory falling below the
# value, not used memory rising above it -- so 20% available == 80% used.
memory {
        format = "RAM %percentage_used"
        memory_used_method = "memavailable"
        threshold_degraded = "40%"
        threshold_critical = "20%"
        # No `decimals` here on purpose: it only affects the unit-converted size
        # placeholders (%used, %available). %percentage_used is hardcoded to one
        # decimal, so "RAM 33%" is not reachable -- hence min_width covers 100,0%.
        min_width = "RAM 100,0%"
        align = "left"
}

tztime local {
        format = "%Y-%m-%d %H:%M:%S"
}
